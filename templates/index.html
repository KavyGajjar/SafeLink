<!DOCTYPE html>
<html>
<head>
    <title>SafeLink</title>
    <style>
        body{
            font-family:Arial,sans-serif;
            background:#f4f4f4;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }
        .box{
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
            text-align:center;
            width:450px;
        }
        input{
            width:95%;
            padding:10px;
            margin:10px 0;
        }
        button{
            padding:10px 20px;
            background:#007BFF;
            color:white;
            border:none;
            cursor:pointer;
        }
        h1{
            color:#007BFF;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>SafeLink</h1>

    <form method="POST">
        <input type="text" name="url" placeholder="Enter URL here" required>
        <br>
        <button type="submit">Analyze URL</button>
    </form>

    {% if result %}
        <h2>{{ result }}</h2>
    {% endif %}
</div>

</body>
</html>
